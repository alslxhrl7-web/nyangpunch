<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>냥펀치 소리 자르기</title>
<style>body { font-family: system-ui, sans-serif; margin: 24px; background: #fffaf2; color: #2b2233; } pre { white-space: pre-wrap; font-size: 13px; }</style></head>
<body><h1>냥펀치 소리 자르기</h1><pre id="out">작업 중…</pre>
<script>
// Cuts Varco results down to game-ready one-shots: trims silence, keeps the first sound event,
// fades the tail, normalises the peak, and saves 44.1 kHz mono 16-bit WAV through the local server.
//   POST /cut/<name>.wav  -> Tools/sound/cut/            (every candidate, for listening)
//   POST /sfx/<key>.wav   -> Assets/NyangPunch/Resources/Sfx/   (the ones the game plays)
const RATE = 44100, WIN = 441;   // 10 ms analysis windows
const ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: RATE });

async function decode(url) {
  const buf = await ac.decodeAudioData(await fetch(url).then(r => r.arrayBuffer()));
  const n = buf.length, mono = new Float32Array(n);
  for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / buf.numberOfChannels; }
  return mono;
}
function envelope(x) {
  const e = new Float32Array(Math.floor(x.length / WIN));
  for (let w = 0; w < e.length; w++) { let s = 0; for (let i = 0; i < WIN; i++) { const v = x[w * WIN + i]; s += v * v; } e[w] = Math.sqrt(s / WIN); }
  return e;
}
// events = stretches above the threshold, split by >= gapMs of quiet
function events(x, gapMs = 150) {
  const e = envelope(x); let peak = 0; for (const v of e) peak = Math.max(peak, v);
  const th = Math.max(peak * 0.06, 0.0015), gap = gapMs / 10, out = []; let start = -1, quiet = 0;
  for (let w = 0; w < e.length; w++) {
    if (e[w] >= th) { if (start < 0) start = w; quiet = 0; }
    else if (start >= 0 && ++quiet >= gap) { out.push([start, w - quiet + 1]); start = -1; quiet = 0; }
  }
  if (start >= 0) out.push([start, e.length]);
  return out.map(([a, b]) => ({ from: a * WIN / RATE, to: b * WIN / RATE }));
}
function zcr(x) { let z = 0; for (let i = 1; i < x.length; i++) if ((x[i] >= 0) !== (x[i - 1] >= 0)) z++; return z / (x.length / RATE) / 2; }   // rough pitch/brightness in Hz
function cut(x, from, to, maxLen) {
  const a = Math.max(0, Math.floor((from - 0.012) * RATE)), b = Math.min(x.length, Math.ceil(Math.min(to + 0.06, from + maxLen) * RATE));
  const y = x.slice(a, b); let peak = 0; for (const v of y) peak = Math.max(peak, Math.abs(v));
  const g = peak > 0 ? 0.85 / peak : 1, fin = Math.floor(0.004 * RATE), fout = Math.min(y.length, Math.floor(0.07 * RATE));
  for (let i = 0; i < y.length; i++) { let k = g; if (i < fin) k *= i / fin; if (i >= y.length - fout) k *= (y.length - i) / fout; y[i] *= k; }
  return y;
}
function wav(y) {
  const b = new ArrayBuffer(44 + y.length * 2), v = new DataView(b), W = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  W(0, 'RIFF'); v.setUint32(4, 36 + y.length * 2, true); W(8, 'WAVE'); W(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, RATE, true); v.setUint32(28, RATE * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); W(36, 'data'); v.setUint32(40, y.length * 2, true);
  for (let i = 0; i < y.length; i++) v.setInt16(44 + i * 2, Math.max(-32768, Math.min(32767, Math.round(y[i] * 32767))), true);
  return b;
}
const post = (path, y) => fetch(path, { method: 'POST', body: wav(y) }).then(r => r.status);

(async () => {
  const log = [], out = document.getElementById('out'), picked = {};
  try {
    // 1) recommended sounds from the video results: use the segment Varco placed on its timeline
    const M = await fetch('varco-video/vs_manifest.json').then(r => r.json());
    const REC = { drop: ['hideout', 2, 0.6], merge: ['hideout', 5, 0.9], level: ['hideout', 11, 1.6], clear: ['clear', 5, 1.8] };
    for (const [key, [scene, i, maxLen]] of Object.entries(REC)) {
      const t = M[scene].tracks[i], x = await decode('varco-video/' + t.file);
      const seg = x.slice(Math.floor((t.from || 0) * RATE), Math.ceil(Math.min(t.to || 99, x.length / RATE) * RATE));
      const ev = events(seg, 250); const first = ev[0] || { from: 0, to: seg.length / RATE };
      const y = cut(seg, first.from, ev.length ? ev[ev.length - 1].to : first.to, maxLen);
      await post('/cut/' + key + '_rec.wav', y); const st = await post('/sfx/' + key + '.wav', y);
      picked[key] = { src: t.name, len: +(y.length / RATE).toFixed(2), status: st };
      log.push(`${key}: "${t.name}" → ${(y.length / RATE).toFixed(2)}초 (저장 ${st})`);
    }
    // 2) sounds the user picked on the comparison page: first sound event of that one file
    const SEL = { squeak: ['pop_7', 0.8], hiss: ['hiss_2', 1.0], throw: ['throw_3', 0.8], hurt: ['hurt_1', 0.9], boss: ['boss_1', 2.0] };
    for (const [key, [name, maxLen]] of Object.entries(SEL)) {
      const x = await decode('varco/' + name + '.mp3'), ev = events(x, key === 'boss' ? 300 : 150);
      const y = cut(x, ev[0].from, ev[0].to, maxLen); const st = await post('/sfx/' + key + '.wav', y);
      picked[key] = { src: name, len: +(y.length / RATE).toFixed(2), status: st };
      log.push(`${key}: 고른 소리 ${name} → ${(y.length / RATE).toFixed(2)}초 (저장 ${st})`);
    }
    // 3) cartoon-style candidates (round 4): keep the first sound event of each, then pick one per key.
    //    CHOICE overrides the measured pick once the user has listened, e.g. { punch: 2 }.
    const CHOICE = { step: 3, punch: 3, bump: 2, bump_pot: 2 };   // picked by the user on the comparison page
    const NEW = { step: { file: 'toon_step', ns: [1, 2, 3], target: 0.15, max: 0.4 }, punch: { file: 'toon_punch', ns: [1, 2, 3], target: 0.35, max: 0.7 },
                  bump: { file: 'toon_bump', ns: [1, 2, 3], target: 0.4, max: 0.8 }, bump_pot: { file: 'toon_pot', ns: [1, 2, 3], target: 0.7, max: 1.2 },
                  pop: { file: 'toon_poof', ns: [1, 2, 3], target: 0.4, max: 0.8 },
                  kill_fly: { file: 'toon_fly', ns: [1, 2, 3], target: 0.4, max: 0.8 }, kill_cucumber: { file: 'toon_cucumber', ns: [1, 2, 3], target: 0.4, max: 0.8 },
                  kill_boss: { file: 'toon_bossdown', ns: [1, 2, 3], target: 1.3, max: 2.0, gap: 300 } };
    for (const [key, cfg] of Object.entries(NEW)) {
      const cands = [];
      for (const n of cfg.ns) {
        const name = (cfg.file || key) + '_' + n, x = await decode('varco/' + name + '.mp3'), ev = events(x, cfg.gap || 150);
        if (!ev.length) { log.push(name + ': 소리 없음'); continue; }
        const y = cut(x, ev[0].from, ev[0].to, cfg.max), len = y.length / RATE, hz = Math.round(zcr(y));
        await post('/cut/' + name + '.wav', y);
        cands.push({ n, name, y, len, hz, onset: ev[0].from, events: ev.length });
        log.push(`  ${name}: 시작 ${ev[0].from.toFixed(2)}초, 길이 ${len.toFixed(2)}초, 밝기 ${hz}Hz, 소리 덩어리 ${ev.length}개`);
      }
      const usable = cands.filter(c => c.len >= 0.12); const pool = usable.length ? usable : cands;
      const best = cands.find(c => c.n === CHOICE[key]) || (cfg.bright ? pool.slice().sort((a, b) => b.hz - a.hz)[0] : pool.slice().sort((a, b) => Math.abs(a.len - cfg.target) - Math.abs(b.len - cfg.target))[0]);
      const st = await post('/sfx/' + key + '.wav', best.y);
      picked[key] = { src: best.name, len: +best.len.toFixed(2), hz: best.hz, status: st };
      log.push(`${key}: ${best.name} 선택 → ${best.len.toFixed(2)}초 (저장 ${st})`);
    }
    window.__cut = { ok: true, picked, log };
  } catch (e) { log.push('오류: ' + e.message); window.__cut = { ok: false, err: e.message, log }; }
  out.textContent = log.join('\n');
})();
</script></body></html>
