<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>바르코 소리 가져오기</title>
<style>body { font-family: system-ui, sans-serif; margin: 24px; background: #fffaf2; color: #2b2233; } pre { white-space: pre-wrap; }</style></head>
<body><h1>바르코 소리 가져오기</h1><pre id="out">받는 중…</pre>
<script>
// The Varco page hands over [{name, url}] in the fragment (never sent over the network); the local server downloads them.
(async () => {
  const out = document.getElementById('out');
  try {
    const list = JSON.parse(decodeURIComponent(location.hash.slice(1)));
    history.replaceState(null, '', location.pathname);   // drop the signed links from the address bar
    const t = await fetch('/grab', { method: 'POST', body: JSON.stringify(list) }).then(r => r.text());
    out.textContent = '완료\n' + t; window.__grab = t;
  } catch (e) { out.textContent = '오류: ' + e.message; window.__grab = 'ERR ' + e.message; }
})();
</script></body></html>
